name: ContextCheck

on:
  pull_request:
  push:

jobs:
  contextcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Full history (not shallow) so scoped-no-match can reason over the
          # Git window. A shallow checkout is detected and handled gracefully
          # (Rule 26) — scoped-rule review findings are simply skipped.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run contextcheck analyze (dogfood from repo)
        # CI gate mode: `--fail-on notice` fails on REVIEW/CAUTION findings.
        # This repo currently has no findings, so it passes. Findings that are
        # only INFO (duplicates/large-file, etc.) still do not fail the build.
        # Once published to npm, replace with: npx contextcheck analyze --fail-on notice
        run: node dist/cli/index.js analyze --json --fail-on notice

      - name: Show informational-only snapshot of findings
        # Always emit the report even when the gate passes, for the PR log.
        if: always()
        run: node dist/cli/index.js analyze --compact
